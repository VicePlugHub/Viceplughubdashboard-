name: VicePlug Scheduled Research

on:
  schedule:
    # Twice daily at 08:17 and 17:47 Jamaica time (UTC-5); minutes avoid the top of the hour.
    - cron: "17 13 * * *"
    - cron: "47 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viceplug-scheduled-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-automation.txt
      - name: Collect and prioritize GTA VI research
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          NEWS_RESEARCH_WORKSHEET: Research Feed
          NEWS_MAX_PER_QUERY: "15"
          NEWS_QUERIES: '"GTA VI" OR "Grand Theft Auto VI"||"GTA 6" Rockstar||Rockstar Games GTA VI trailer gameplay map'
        run: python scheduled_research.py
